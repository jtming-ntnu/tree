<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>任務森林｜扭蛋養樹與毛孩</title>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6f6ea;--card:#fff;--ink:#22352c;--mut:#5f7a6c;--g:#2f9e6e;--gd:#1f6b4f;--pink:#ff6f91;--sun:#ffc93c;--lil:#7b6cf6;--line:#d3e8da;--soft:#f2faf4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#112018;--card:#1b2e24;--ink:#e6f4ea;--mut:#9bb8a8;--line:#2c4739;--soft:#16271e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#112018;--card:#1b2e24;--ink:#e6f4ea;--mut:#9bb8a8;--line:#2c4739;--soft:#16271e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
html,body{height:100%;overflow:hidden}
.wrap{max-width:1100px;margin:auto;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:12px;display:grid;gap:12px;grid-template-columns:1fr;grid-template-rows:auto minmax(0,46dvh) minmax(0,1fr);grid-template-areas:"top" "world" "tasks"}
@media(min-width:900px){.wrap{grid-template-columns:1.1fr .9fr;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "tasks world"}}
@media(max-width:600px){
 .top p{display:none}h1{font-size:20px}.card{padding:12px}.pill{padding:6px 10px;font-size:14px}.pill-tx{display:none}
 .meter small{display:none}.meter{margin-top:6px}.gbtn{width:44px;height:44px;font-size:21px}.ibtn{width:34px;height:34px;font-size:15px}
 .top-l,.top-r{gap:6px}.task{gap:5px;padding:8px 7px}.task button{width:26px;height:26px;font-size:13px}.rep-tag.off{width:26px!important;height:26px!important}
 .hud-tx{display:none}.deco-btn{padding:4px 8px}
 .add{grid-template-columns:1fr auto auto}.add input{grid-column:1 / -1}
}
@media(max-height:520px) and (max-width:899px){.wrap{grid-template-rows:auto minmax(0,110px) minmax(0,1fr)}.meter,.tabs,.world-act{display:none!important}}
.top{grid-area:top;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.top-l,.top-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:26px;color:var(--gd)}
:root[data-theme="dark"] h1{color:#7ee0ad}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) h1{color:#7ee0ad}}
.top p{margin:2px 0 0;color:var(--mut);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--sun);color:#4a3600;font-size:17px}
.pill.bump{animation:bump .5s}
.ibtn{position:relative;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:18px;display:grid;place-items:center;transition:transform .15s,border-color .15s}
.ibtn:hover{transform:scale(1.07);border-color:var(--g)}
.ibtn.off{opacity:.65}
.ibtn.ready{border-color:var(--sun);animation:wob 1.8s infinite}
.abdg{position:absolute;right:-5px;top:-5px;min-width:19px;padding:0 5px;border-radius:99px;background:#e8384f;color:#fff;font-size:11px;font-weight:400;line-height:19px;text-align:center}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:16px}
h2{margin:0 0 10px;font-size:19px}
.task-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.task-head h2{margin:0}
.mini-tog{border:2px solid var(--line);background:var(--soft);color:var(--mut);border-radius:99px;padding:3px 10px;font-size:12px;display:inline-flex;align-items:center;gap:4px;transition:border-color .15s,background .15s,color .15s}
.mini-tog.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 12%,var(--card));color:var(--g)}
#world{grid-area:world;display:flex;flex-direction:column;min-height:0}#tasks{grid-area:tasks;display:flex;flex-direction:column;min-height:0}
#gacha,#daily,#bk,#stats,#decoPop{text-align:center;position:relative;width:100%;max-width:360px;max-height:94dvh;overflow:auto}
#stats,#decoPop{max-width:440px}
#gov,#dov,#bov,#sov,#decov{z-index:40}
#bk textarea{display:block;width:100%;margin:8px 0;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--soft);font-size:12px;word-break:break-all;resize:vertical}#bk h3{margin:18px 0 0;font-size:16px}#bk .btn{width:100%}
/* scene */
.scene{position:relative;flex:1;min-height:90px;border-radius:20px;overflow:hidden;background:linear-gradient(#8fd6ff,#e9fbff 64%,#8fd694 64%,#59b06a);user-select:none;touch-action:none;transition:background .8s ease,box-shadow .5s ease}
.scene.star-1{box-shadow:inset 0 0 0 3px #ffc93c,0 0 14px #ffc93c55}
.scene.star-1 #tree{filter:drop-shadow(0 0 8px #ffb3c7aa) hue-rotate(-14deg) saturate(1.16)}
.scene.star-1 #pet{filter:drop-shadow(0 0 8px #ffd95acc)}
.scene.star-2{box-shadow:inset 0 0 0 3px #a78bfa,0 0 16px #a78bfa66}
.scene.star-2 #tree{filter:drop-shadow(0 0 10px #7ee0adbb) hue-rotate(24deg) saturate(1.25)}
.scene.star-2 #pet{filter:drop-shadow(0 0 10px #c4b5fdcc)}
.scene.star-3{box-shadow:inset 0 0 0 3px #ff6f91,0 0 18px #ffc93c88}
.scene.star-3 #tree{filter:drop-shadow(0 0 12px #ffc93ccc) hue-rotate(-28deg) saturate(1.32) brightness(1.06)}
.scene.star-3 #pet{filter:drop-shadow(0 0 12px #ff9a9ecc) saturate(1.15)}
.sun{position:absolute;right:16px;top:10px;font-size:38px;pointer-events:none;z-index:2;transition:transform .4s}
.cloud{position:absolute;font-size:34px;animation:drift 30s linear infinite;pointer-events:none;z-index:2}
.hill{position:absolute;bottom:-40px;left:-10%;width:70%;height:110px;border-radius:50%;background:#6cc47b;pointer-events:none;z-index:1;transition:background .8s ease}
#starLayer,#weatherLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#starLayer{z-index:1;opacity:0;transition:opacity .8s ease}
#starLayer.on{opacity:1}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fffbe0;box-shadow:0 0 6px #fff;animation:twinkle 2.6s ease-in-out infinite alternate}
#weatherLayer{z-index:6}
.wp-rain{position:absolute;top:-16px;width:2px;height:14px;border-radius:2px;background:linear-gradient(transparent,#dff6ff);opacity:.7;animation:rainFall linear infinite}
.wp-petal{position:absolute;top:-24px;font-size:15px;opacity:.9;animation:petalFall linear infinite}
.wp-snow{position:absolute;top:-20px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 5px #fff;opacity:.85;animation:snowFall linear infinite}
.wp-meteor{position:absolute;width:64px;height:2px;border-radius:99px;background:linear-gradient(90deg,transparent,#fff8c4,#ffffff);box-shadow:0 0 8px #ffe484;opacity:0;animation:meteorFall linear infinite}
.wp-aurora{position:absolute;top:-10%;left:-10%;width:120%;height:58%;background:linear-gradient(120deg,transparent 10%,#38f9d755 32%,#7b6cf666 56%,#ff6f9144 76%,transparent 92%);filter:blur(14px);mix-blend-mode:screen;animation:auroraWave 7s ease-in-out infinite alternate}
.wp-rainbow{position:absolute;left:50%;top:14%;width:92%;height:78%;transform:translateX(-50%);border-radius:50% 50% 0 0;border:16px solid transparent;box-shadow:inset 0 0 0 4px #ff6f9155,inset 0 0 0 8px #ffc93c55,inset 0 0 0 12px #8fe08f55,inset 0 0 0 16px #6fd0ff55,inset 0 0 0 20px #b78cff55;opacity:.75;pointer-events:none}
.wp-sparkle{position:absolute;font-size:13px;opacity:.85;animation:twinkle 1.8s ease-in-out infinite alternate}
.scene-hud{position:absolute;left:10px;top:10px;z-index:9;display:flex;flex-wrap:nowrap;gap:6px;max-width:calc(100% - 62px)}
.deco-btn{border:2px solid #ffffffaa;background:#ffffffcc;color:#22352c;border-radius:99px;padding:4px 10px;font-size:12px;display:inline-flex;align-items:center;gap:4px;backdrop-filter:blur(4px);transition:transform .15s;white-space:nowrap}
.deco-btn:hover{transform:scale(1.05)}
.world-act{display:none;gap:8px;margin-top:8px;flex-wrap:wrap}
.world-act.on{display:flex}
.wact-btn{flex:1;min-width:140px;border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:transform .15s}
.wact-btn:hover{transform:translateY(-1px)}
.wact-btn.ascend{background:linear-gradient(135deg,#fff3b0,#ffd166);border-color:#ff9f1c;color:#4a3000;box-shadow:0 2px 0 #e09f1c}
.wact-btn.grow-pick{background:color-mix(in srgb,var(--g) 14%,var(--card));border-color:var(--g);color:var(--g);box-shadow:0 2px 0 var(--gd)}
#tree{position:absolute;left:2%;bottom:0;width:60%;height:100%;transform-origin:50% 92%;cursor:pointer;z-index:2;transition:filter .5s ease}
#tree.boing{animation:boing .6s}
#pet{position:absolute;right:9%;bottom:18px;line-height:1;cursor:pointer;transform-origin:bottom;animation:bob 1.7s ease-in-out infinite;transition:font-size .4s,filter .5s ease;z-index:5;display:inline-flex;align-items:center;justify-content:center}
#pet.hop{animation:hop .7s}
.pet-hat{position:absolute;top:-0.42em;left:50%;transform:translateX(-50%);font-size:0.52em;pointer-events:none;filter:drop-shadow(0 2px 3px #0004);line-height:1}
.pet-hat.shades{top:0.18em;font-size:0.46em}
#tree:focus-visible,#pet:focus-visible{outline:3px solid var(--lil);outline-offset:2px;border-radius:14px}
.bubble{position:absolute;right:4%;top:50px;max-width:56%;padding:7px 12px;border-radius:14px;background:#fff;color:#22352c;font-size:13px;line-height:1.4;opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none;z-index:8;box-shadow:0 4px 12px #0002}
.bubble.on{opacity:1;transform:none}
.deco-item{position:absolute;transform:translate(-50%,-50%);font-size:30px;line-height:1;cursor:grab;z-index:4;filter:drop-shadow(0 3px 4px #0003);transition:transform .15s;touch-action:none}
.deco-item:active{cursor:grabbing;transform:translate(-50%,-50%) scale(1.2);z-index:7}
.meter{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;margin-top:10px;font-size:14px}
.meter b{font-weight:400}
.bar{height:12px;border-radius:9px;background:var(--soft);border:1px solid var(--line);overflow:hidden;grid-column:2}
.bar i{display:block;height:100%;width:0;border-radius:9px;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.m-tree i{background:linear-gradient(90deg,#8fe08f,#2f9e6e)}.m-pet i{background:linear-gradient(90deg,#ffd36b,#ff8a4c)}
.meter small{grid-column:2;color:var(--mut)}
/* tasks */
.add{display:grid;grid-template-columns:1fr auto auto auto;gap:7px;align-items:center}
.add input,.add select{padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--soft);min-width:0}
.add input:focus,.add select:focus{outline:3px solid var(--lil);border-color:transparent}
.add-rep{padding:9px 10px;border-radius:14px;border:2px solid var(--line);background:var(--soft);color:var(--mut);font-size:13px;white-space:nowrap;transition:border-color .15s,background .15s,color .15s}
.add-rep.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 15%,var(--card));color:var(--g)}
.btn{padding:10px 18px;border:0;border-radius:14px;background:var(--g);color:#fff;font-size:16px;box-shadow:0 4px 0 var(--gd);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gd)}
.btn:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--lil);outline-offset:2px}
.hint{display:none;margin:8px 0 0;font-size:13px;color:var(--lil)}.hint.on{display:block}
.hint button{border:0;background:none;color:inherit;text-decoration:underline}
#list{margin-top:12px;display:grid;align-content:start;gap:7px;flex:1;min-height:0;overflow:auto;padding:2px}
.task{display:flex;align-items:center;gap:7px;padding:9px 10px;border-radius:16px;border:2px solid var(--line);background:var(--soft);animation:pop .3s;margin-left:calc(var(--lv,0) * 20px)}
@media(max-width:600px){.task{margin-left:calc(var(--lv,0) * 12px)}}
.task.l0{border-color:var(--lil);background:color-mix(in srgb,var(--lil) 10%,var(--card))}
.task.l1{border-color:#7fd1a5}
.task.l2{border-style:dashed}
.task.done{opacity:.55}.task.done .nm{text-decoration:line-through;cursor:default}
.task input[type="checkbox"]{width:22px;height:22px;accent-color:var(--g);flex:none}
.nm{flex:1;min-width:0;overflow-wrap:anywhere;cursor:text}
.nm-edit{flex:1;min-width:0;padding:2px 8px;border-radius:8px;border:2px solid var(--lil);background:var(--card)}
.l0 .nm{font-size:17px}.l2 .nm{font-size:14px}
.cnt{font-style:normal;font-size:12px;padding:1px 8px;border-radius:9px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.rep-tag{border:1px solid var(--g)!important;background:color-mix(in srgb,var(--g) 12%,var(--card))!important;color:var(--g)!important;width:auto!important;height:24px!important;padding:0 7px!important;border-radius:99px!important;font-size:11px!important;white-space:nowrap}
.rep-tag.off{border:1px solid var(--line)!important;background:var(--card)!important;color:var(--mut)!important;width:28px!important;height:28px!important;padding:0!important;border-radius:10px!important;font-size:13px!important;opacity:.65}.rep-tag.off:hover{opacity:1;border-color:var(--g)!important;background:color-mix(in srgb,var(--g) 15%,var(--card))!important;color:var(--g)!important}.task button.del-cfm{width:auto;padding:0 8px;background:var(--pink);color:#fff;font-size:12px;white-space:nowrap;animation:pop .2s}
.fold-btn{width:24px!important;height:24px!important;font-size:12px!important;border-radius:8px!important;background:transparent!important}
.fold-btn:hover{background:var(--line)!important;color:var(--ink)!important}
.rw{font-size:12px;color:var(--mut);white-space:nowrap}
.task button{border:0;background:var(--card);border-radius:10px;width:28px;height:28px;color:var(--mut);flex:none;display:grid;place-items:center}
.task button:hover{background:var(--pink);color:#fff}
.task button[data-a="edit"]:hover{background:var(--lil);color:#fff}
.task button[data-a="sub"]:hover{background:var(--g);color:#fff}
.empty{text-align:center;color:var(--mut);padding:26px 0}
.foot{margin-top:10px;font-size:13px;color:var(--mut);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}.fa{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end}
.foot button{border:0;background:none;color:var(--mut);text-decoration:underline}
/* gacha */
.machine{width:210px;margin:6px auto 0;position:relative}
.globe{height:150px;border-radius:50% 50% 42% 42%;border:7px solid var(--pink);position:relative;overflow:hidden;background:radial-gradient(circle at 30% 25%,#fff 0,#fff0 14%),linear-gradient(145deg,#e4f8ff,#a7e1ee)}
.cap{position:absolute;width:34px;height:34px;border-radius:50%;background:linear-gradient(180deg,var(--c) 50%,#fff 50%);box-shadow:inset -3px -4px 6px #0003;animation:idle 2.6s ease-in-out infinite alternate}
.base{height:96px;margin-top:-8px;border-radius:20px 20px 28px 28px;background:linear-gradient(#ff8fa8,#e0476b);position:relative;box-shadow:0 8px 0 #b3314f}
.knob{position:absolute;left:26px;top:20px;width:56px;height:56px;border-radius:50%;border:4px solid #b3314f;background:radial-gradient(#fff3b0,var(--sun));display:grid;place-items:center;cursor:pointer;transition:transform .9s cubic-bezier(.5,0,.3,1)}
.knob:after{content:"";width:34px;height:10px;border-radius:9px;background:#fff;border:2px solid #c98a00}
.knob.turn{transform:rotate(540deg)}
.chute{position:absolute;right:26px;top:26px;width:60px;height:46px;border-radius:12px 12px 16px 16px;background:#4d1a2a;border:4px solid #ffd0a0;display:grid;place-items:center}
#drop{width:32px;height:32px;border-radius:50%;opacity:0;background:linear-gradient(180deg,var(--c,#8fe08f) 50%,#fff 50%)}
#drop.go{animation:drop .6s cubic-bezier(.3,1.5,.5,1) forwards}
.machine.shake .globe{animation:shake .3s 3}
.machine.shake .cap{animation:chaos .22s infinite alternate}
#spin{margin-top:16px;width:100%;max-width:280px;padding:13px;font-size:18px;background:var(--pink);box-shadow:0 5px 0 #b3314f}
#spin:disabled{opacity:.45;pointer-events:none}
#spinAll{display:block;margin:10px auto 0;width:100%;max-width:280px;padding:11px;font-size:16px;background:var(--lil);box-shadow:0 5px 0 #4b3fc0}#spinAll:disabled{opacity:.45;pointer-events:none}
.odds{margin:10px 0 0;font-size:13px;color:var(--mut)}
.gbtn{position:relative;width:52px;height:52px;border-radius:50%;border:3px solid var(--pink);background:var(--card);font-size:25px;display:grid;place-items:center;box-shadow:0 4px 0 #b3314f;transition:transform .15s}.gbtn:hover{transform:rotate(-8deg) scale(1.08)}.gbtn.ready{animation:wob 1.8s infinite}.gbtn b{position:absolute;right:-6px;top:-6px;min-width:22px;padding:0 6px;border-radius:99px;background:var(--pink);color:#fff;font-size:13px;font-weight:400;line-height:22px}.gx{position:absolute;right:12px;top:10px;border:0;background:var(--soft);width:32px;height:32px;border-radius:50%;color:var(--mut)}
@keyframes wob{0%,70%,100%{transform:none}78%{transform:rotate(-12deg)}86%{transform:rotate(12deg)}94%{transform:rotate(-6deg)}}
.tabs{display:flex;gap:6px;margin-top:8px}.sc{position:relative;flex:1;border:2px solid var(--line);background:var(--soft);border-radius:14px;padding:3px 0;font-size:20px;line-height:1.2}.sc small{display:block;font-size:11px;color:var(--mut)}.sc.on{border-color:var(--g);background:var(--card);box-shadow:0 3px 0 var(--g)}.sc:disabled{opacity:.5;cursor:not-allowed}
.sc .st-tag{position:absolute;right:4px;top:2px;font-size:10px;padding:0 5px;border-radius:99px;background:var(--sun);color:#4a3000;line-height:1.5}
.gbtn.d{border-color:var(--g);box-shadow:0 4px 0 var(--gd)}.gbtn.d b{background:#e8384f}
.q{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;text-align:left;padding:12px;margin-top:10px;border:2px solid var(--line);border-radius:18px;background:var(--soft)}.q .e{font-size:30px}.q p{margin:0;color:var(--mut);font-size:13px}.q.ok{opacity:.6}.q .btn{padding:8px 14px;font-size:15px}.q .btn:disabled{opacity:.5;box-shadow:none}
.cl{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-size:13px;color:var(--mut)}.cl[data-s=ok]{border-color:var(--g);color:var(--g)}.cl[data-s=sync]{border-color:var(--sun)}.cl[data-s=off]{border-style:dashed}
@media(max-width:600px){.cl small{display:none}}
/* stats & achievements */
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.sbox{background:var(--soft);border:2px solid var(--line);border-radius:16px;padding:10px 8px;text-align:center}
.sbox b{display:block;font-size:22px;color:var(--g)}
.sbox small{font-size:12px;color:var(--mut)}
.ach-h{margin:16px 0 8px;font-size:16px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ach-all{border:0;border-radius:99px;background:var(--sun);color:#4a3000;padding:4px 11px;font-size:12px;box-shadow:0 2px 0 #c98a00}
.ach-list{display:grid;gap:7px;text-align:left}
.ach{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:16px;border:2px solid var(--line);background:var(--soft);opacity:.6}
.ach.ok{opacity:1;border-color:var(--g);background:color-mix(in srgb,var(--g) 10%,var(--card))}
.ach.claim{opacity:1;border-color:var(--sun);background:color-mix(in srgb,var(--sun) 16%,var(--card))}
.ach .ae{font-size:26px;flex:none}
.ach .at{flex:1;min-width:0}
.ach .at b{display:block;font-size:14px}
.ach .at small{display:block;font-size:12px;color:var(--mut)}
.ach .st{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.ach.ok .st{background:var(--g);color:#fff;border-color:var(--g)}
.ach .claim-btn{border:0;border-radius:99px;background:var(--sun);color:#4a3000;padding:5px 11px;font-size:12px;white-space:nowrap;box-shadow:0 2px 0 #c98a00}
/* collection modal */
.ctabs{display:flex;gap:6px;margin-top:10px}
.ctab{flex:1;padding:7px 6px;border-radius:12px;border:2px solid var(--line);background:var(--soft);font-size:13px;color:var(--mut)}
.ctab.on{border-color:var(--g);background:var(--card);color:var(--g);box-shadow:0 2px 0 var(--g)}
.dsec{margin-top:14px;text-align:left}
.dsec-h{font-size:14px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
.dsec-h small{font-size:12px;color:var(--mut)}
.dsec.cur .dsec-h{color:var(--g)}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dcard{border:2px solid var(--line);border-radius:16px;background:var(--soft);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;transition:transform .15s,border-color .15s}
.dcard .de{font-size:28px;line-height:1.1}
.dcard.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 12%,var(--card));box-shadow:0 3px 0 var(--g)}
.dcard.lock{opacity:.48;cursor:not-allowed}
.dcard small{font-size:11px;color:var(--mut)}
/* popup & toasts */
.ov{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:50;padding:16px}.ov.on{display:grid}
.box{background:var(--card);border-radius:30px;padding:26px 24px;text-align:center;max-width:340px;width:100%;max-height:94dvh;overflow:auto;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.box .big{font-size:84px;line-height:1.1;animation:bob 1.2s ease-in-out infinite}
.box h3{margin:6px 0 2px;font-size:22px}.box p{margin:4px 0;color:var(--mut)}
.up{color:var(--g);font-size:17px;margin-top:8px!important}
.fx{position:fixed;z-index:99;pointer-events:none;font-size:22px;animation:fly .95s cubic-bezier(.15,.9,.3,1) forwards}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;transition:.3s;z-index:60;max-width:92%;display:inline-flex;align-items:center;gap:10px;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast button{border:0;background:var(--sun);color:#4a3600;padding:3px 10px;border-radius:99px;font-size:13px;white-space:nowrap}
#achToast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-130px);opacity:0;background:linear-gradient(135deg,#fff5c0,#ffd166);color:#4a3000;border:2px solid #ff9f1c;padding:9px 16px;border-radius:99px;box-shadow:0 8px 20px #0003;transition:.35s cubic-bezier(.3,1.4,.5,1);z-index:65;max-width:92%;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
#achToast.on{opacity:1;transform:translate(-50%,0)}
@keyframes drift{from{left:-15%}to{left:110%}}
@keyframes twinkle{from{opacity:.25;transform:scale(.8)}to{opacity:1;transform:scale(1.25)}}
@keyframes rainFall{0%{transform:translate(0,0) rotate(12deg)}100%{transform:translate(-28px,380px) rotate(12deg)}}
@keyframes petalFall{0%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(22px,180px) rotate(160deg)}100%{transform:translate(-16px,380px) rotate(320deg)}}
@keyframes snowFall{0%{transform:translate(0,0)}50%{transform:translate(16px,180px)}100%{transform:translate(-12px,380px)}}
@keyframes meteorFall{0%{transform:translate(0,0) rotate(-32deg);opacity:0}12%{opacity:1}70%{opacity:.9}100%{transform:translate(-240px,150px) rotate(-32deg);opacity:0}}
@keyframes auroraWave{0%{transform:translateX(-6%) skewX(-8deg) scaleY(.92);opacity:.65}50%{transform:translateX(6%) skewX(8deg) scaleY(1.08);opacity:.95}100%{transform:translateX(-3%) skewX(-4deg) scaleY(.96);opacity:.75}}
@keyframes bob{50%{transform:translateY(-7px)}}
@keyframes hop{30%{transform:translateY(-40px) scale(1.1,.9)}60%{transform:scale(1.1,.9)}}
@keyframes boing{30%{transform:scale(1.1,.88)}60%{transform:scale(.94,1.1)}}
@keyframes pop{from{transform:scale(.7);opacity:0}}
@keyframes bump{40%{transform:scale(1.25) rotate(-4deg)}}
@keyframes idle{to{transform:translateY(-5px) rotate(8deg)}}
@keyframes shake{25%{transform:translate(-6px,2px) rotate(-3deg)}75%{transform:translate(6px,-2px) rotate(3deg)}}
@keyframes chaos{to{transform:translate(10px,-34px) rotate(80deg)}}
@keyframes drop{from{transform:translateY(-34px) scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1.2);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}

function normalize(o){
 const base=fresh();
 const m=Object.assign(base,o);
 m.daily=Object.assign(base.daily,o.daily||{});
 m.wxPref=Object.assign(base.wxPref,o.wxPref||{});
 const scBase=[0,1,2,3].map(()=>({p:0,a:0}));
 if(Array.isArray(o.sc)){
  for(let i=0;i<4;i++){
   if(o.sc[i]&&typeof o.sc[i]==="object"){
    scBase[i]={p:Math.max(0,+o.sc[i].p||0),a:Math.max(0,+o.sc[i].a||0)};
   }
  }
 }
 m.sc=scBase;
 if(o.tree!==undefined&&!o.sc)m.sc[0]={p:Math.max(0,+o.tree||0),a:Math.max(0,+o.pet||0)};
 delete m.tree;delete m.pet;
 const stBase=[0,0,0,0];
 if(Array.isArray(o.stars)){for(let i=0;i<4;i++)stBase[i]=Math.max(0,Math.floor(+o.stars[i]||0))}
 m.stars=stBase;
 if(!Array.isArray(m.tasks))m.tasks=[];
 else m.tasks=m.tasks.map(t=>({id:t.id||uid(),name:String(t.name||""),level:Math.max(0,Math.min(2,+t.level||0)),done:!!t.done,repeat:!!t.repeat,collapsed:!!t.collapsed}));
 if(!Array.isArray(m.decos))m.decos=[];
 if(!m.placed||typeof m.placed!=="object")m.placed={};
 if(!Array.isArray(m.hats))m.hats=[];
 if(!m.equippedHat||typeof m.equippedHat!=="object")m.equippedHat={};
 if(!Array.isArray(m.specialWx))m.specialWx=[];
 if(!Array.isArray(m.achClaimed))m.achClaimed=[];
 m.grow=Math.max(0,Math.min(3,+m.grow||0));
 m.unlocked=Math.max(m.grow,Math.min(3,o.unlocked!==undefined?(+o.unlocked||0):m.grow));
 m.view=Math.max(0,Math.min(m.unlocked,+m.view||0));
 const allMaxNow=[0,1,2,3].every(i=>stage(m.sc[i].p,th(i,TT,m.stars[i]))>=4&&stage(m.sc[i].a,th(i,PT,m.stars[i]))>=3);
 m.allEverDone=!!(o.allEverDone||allMaxNow||m.stars.some(x=>x>0)||m.decos.length>0||m.hats.length>0||m.specialWx.length>0);
 if(m.allEverDone)m.unlocked=3;
 m.daily.maxStreak=Math.max(m.daily.maxStreak||0,m.daily.streak||0);
 m.daily.maxToday=Math.max(m.daily.maxToday||0,m.daily.todayDone||0);
 return m}

let audioCtx=null;
function tone(f){
 if(prefs.muted)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  if(!audioCtx||audioCtx.state==="closed")audioCtx=new AC();
  if(audioCtx.state==="suspended")audioCtx.resume();
  const n=audioCtx.currentTime;
  f.forEach((q,i)=>{
   const o=audioCtx.createOscillator(),g=audioCtx.createGain();
   o.type="triangle";o.frequency.value=q;o.connect(g);g.connect(audioCtx.destination);
   g.gain.setValueAtTime(.0001,n+i*.08);
   g.gain.exponentialRampToValueAtTime(.12,n+i*.08+.02);
   g.gain.exponentialRampToValueAtTime(.0001,n+i*.08+.25);
   o.start(n+i*.08);o.stop(n+i*.08+.26);
  });
 }catch(e){}
}
function fx(x,y,em,n=9){for(let i=0;i<n;i++){const s=document.createElement("span"),a=Math.PI*2*i/n,d=50+Math.random()*60;s.className="fx";s.textContent=em[i%em.length];s.style.left=x+"px";s.style.top=y+"px";s.style.setProperty("--x",Math.cos(a)*d+"px");s.style.setProperty("--y",Math.sin(a)*d-24+"px");s.style.setProperty("--r",Math.random()*240-120+"deg");document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}

 let h="";
 if(curWeather==="rain"){
  for(let i=0;i<22;i++){
   const left=(Math.random()*106-3).toFixed(1),delay=(Math.random()*4).toFixed(2),dur=(0.7+Math.random()*0.45).toFixed(2);

  }
 }else if(curWeather==="petal"){
  for(let i=0;i<16;i++){
   const left=(Math.random()*106-3).toFixed(1),delay=(Math.random()*4).toFixed(2),dur=(4.5+Math.random()*2.8).toFixed(2),em=i%3===0?"🌼":"🌸";

const key=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
const yest=()=>key(new Date(Date.now()-864e5));
function dayCheck(){
 const D=S.daily,t=key(new Date());
 if(D.d!==t){
  const hadPrev=!!D.d;
  D.d=t;D.signed=false;D.small=false;D.claimed=false;D.todayDone=0;
  let resetRep=0;
  if(hadPrev){
   S.tasks.forEach(tk=>{if(tk.repeat&&tk.done){tk.done=false;resetRep++}});
  }
  return resetRep>0;
 }
 return false;
}
function curStreak(){dayCheck();const D=S.daily;return(D.last===D.d||D.last===yest())?(D.streak||0):0}
function dailyBadge(){dayCheck();const D=S.daily,n=(D.signed?0:1)+(D.small&&!D.claimed?1:0),b=$("dBadge");b.textContent=n;b.style.display=n?"":"none";$("dOpen").classList.toggle("ready",n>0)}
function renderDaily(){dayCheck();const D=S.daily,ns=D.signed?D.streak:(D.last===yest()?D.streak+1:1),g=2+(ns>=3?1:0);
 $("dList").innerHTML='<div class="q'+(D.signed?" ok":"")+'"><span class="e">📅</span><div><b>每日簽到</b><p>🔥 連續 '+ns+' 天，連續 3 天起多 +1 張</p></div><button class="btn" data-q="sign" '+(D.signed?"disabled":"")+'>'+(D.signed?"已簽到":"+"+g+" 🎟️ 簽到")+'</button></div><div class="q'+(D.claimed?" ok":"")+'"><span class="e">🌿</span><div><b>完成 1 個小任務或大任務</b><p>今天完成任一個 🌿 小任務或 🌳 大任務（'+(D.small?1:0)+'/1）</p></div><button class="btn" data-q="claim" '+(D.small&&!D.claimed?"":"disabled")+'>'+(D.claimed?"已領取":D.small?"+2 🎟️ 領取":"未完成")+'</button></div>'}

const done_=i=>{const[a,b]=sst(i);return a>=4&&b>=3};

const lockedHidden=()=>[...lockedHats().map(h=>({k:"hat",item:h})),...lockedWx().map(w=>({k:"wx",item:w}))];

// Achievement System (with instant notification & claimable ticket rewards)
let notifiedAchs=new Set();
function getAchievements(){
 dayCheck();
 const cs=curStreak();
 const bestStreak=Math.max(cs,S.daily.maxStreak||0);
 const bestToday=Math.max(S.daily.todayDone||0,S.daily.maxToday||0);
 const hiddenOwned=S.hats.length+S.specialWx.length;
 return[
  {id:"first",e:"🌱",n:"初入森林",d:"完成第 1 個任務",rw:1,ok:S.done>=1},
  {id:"ten",e:"📝",n:"行動派",d:"累計完成 10 個任務",rw:2,ok:S.done>=10},
  {id:"day5",e:"⚡",n:"效率達人",d:"單日完成 5 個任務",rw:2,ok:bestToday>=5},
  {id:"streak3",e:"🔥",n:"持之以恆",d:"連續簽到滿 3 天",rw:2,ok:bestStreak>=3},
  {id:"pull10",e:"🎰",n:"扭蛋收藏家",d:"累計扭蛋 10 次",rw:2,ok:S.pulls>=10},
  {id:"sc0",e:"🌳",n:"綠手指",d:"完成第 1 個場景培育",rw:2,ok:done_(0)||S.unlocked>=1||S.stars[0]>0},
  {id:"allsc",e:"🏆",n:"森林守護者",d:"四個場景全部培育滿等",rw:4,ok:S.allEverDone||allDone()},
  {id:"deco4",e:"🎨",n:"空間設計師",d:"收集至少 4 件場景裝飾品",rw:2,ok:S.decos.length>=4},
  {id:"star1",e:"⭐",n:"生態轉生",d:"將任一場景進行升星轉生",rw:3,ok:totalStars()>=1},
  {id:"hid3",e:"👑",n:"時尚天氣師",d:"收集至少 3 件夥伴頭飾或限定天氣",rw:3,ok:hiddenOwned>=3}
 ];
}
function checkAchievements(silent=false){
 const achs=getAchievements();
 const claimable=achs.filter(a=>a.ok&&!S.achClaimed.includes(a.id));
 const b=$("aBadge");
 b.textContent=claimable.length;
 b.style.display=claimable.length?"":"none";
 $("statOpen").classList.toggle("ready",claimable.length>0);
 if(silent){
  claimable.forEach(a=>notifiedAchs.add(a.id));
  return;
 }
 const freshNew=claimable.filter(a=>!notifiedAchs.has(a.id));
 if(freshNew.length){
  freshNew.forEach(a=>notifiedAchs.add(a.id));
  showAchBanner(freshNew[0]);
  tone([659,880,1046]);
 }
}

// Build hierarchical task list with optional "sink done" sorting and parent folding
function buildRenderTasks(){
 const T=S.tasks;
 const roots=[];
 const stack=[];
 for(let i=0;i<T.length;i++){
  const node={task:T[i],children:[]};
  while(stack.length&&stack[stack.length-1].task.level>=node.task.level)stack.pop();
  if(stack.length)stack[stack.length-1].children.push(node);
  else roots.push(node);
  stack.push(node);
 }
 function calcStats(node){
  let total=0,done=0;
  for(const ch of node.children){
   const s=calcStats(ch);
   total+=1+s.total;
   done+=(ch.task.done?1:0)+s.done;
  }
  node.subTotal=total;
  node.subDone=done;
  if(prefs.sinkDone&&node.children.length>1){
   node.children.sort((a,b)=>(a.task.done?1:0)-(b.task.done?1:0));
  }
  return{total,done};
 }
 roots.forEach(calcStats);
 if(prefs.sinkDone&&roots.length>1){
  roots.sort((a,b)=>(a.task.done?1:0)-(b.task.done?1:0));
 }
 const flat=[];
 function walk(nodes){
  for(const nd of nodes){
   flat.push(nd);
   if(!nd.task.collapsed&&nd.children.length)walk(nd.children);
  }
 }
 walk(roots);
 return flat;
}

function pick(){

   return{n:pickH.item.n,i:pickH.item.i,k:pickH.k,item:pickH.item,v:0,r:1,c:pickH.item.c};
  }
 }
 let pool=S.dry>=5?PRIZES.filter(p=>p.r):PRIZES;
 let x=Math.random()*pool.reduce((a,p)=>a+p.w,0);

let delCfmId=null,delCfmBtn=null,delCfmT=null;
function clearDelCfm(){
 clearTimeout(delCfmT);delCfmT=null;delCfmId=null;
 if(delCfmBtn){delCfmBtn.classList.remove("del-cfm");delCfmBtn.textContent="✕";delCfmBtn=null}

$("list").addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 const id=b.dataset.id,a=b.dataset.a;
 if(a==="edit"){startEditTask(id);return}
 if(a==="sub"){setParent(id);return}
 if(a==="fold"){
  const t=S.tasks.find(x=>x.id===id);
  if(t){t.collapsed=!t.collapsed;renderTasks();save()}
  return;
 }
 if(a==="rep"){
  const t=S.tasks.find(x=>x.id===id);
  if(t){t.repeat=!t.repeat;renderAll();toast(t.repeat?"已設為每日重複任務":"已取消每日重複")}
  return;
 }
 if(a==="del"){
  const idx=S.tasks.findIndex(t=>t.id===id);
  if(idx>-1){
   const lv=S.tasks[idx].level;
   let end=idx+1;
   while(end<S.tasks.length&&S.tasks[end].level>lv)end++;
   const targets=S.tasks.slice(idx,end);
   const hasUndone=targets.some(x=>!x.done);
   if(hasUndone&&delCfmId!==id){
    clearDelCfm();
    delCfmId=id;
    delCfmBtn=b;
    b.classList.add("del-cfm");
    b.textContent="確認?";
    toast(targets.length>1?"尚有未完成項目（含細項共 "+targets.length+" 項），再按一次確認刪除":"此任務尚未完成，再按一次確認刪除");
    delCfmT=setTimeout(clearDelCfm,3000);
    return;
   }
   clearDelCfm();
   const removed=S.tasks.splice(idx,end-idx);
   if(removed.some(x=>x.id===parent))clearParent();
   renderAll();
   if(removed.length>1)toast("已一併刪除 "+removed.length+" 項任務（含子項目）");
  }
 }
});

const BK2="TFOREST2:",BK1="TFOREST1:";
function encodeBackup(obj){
 const bytes=new TextEncoder().encode(JSON.stringify(obj));
 let bin="";
 for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
 return BK2+btoa(bin);
}
function decodeBackup(raw){
 const prefix=raw.startsWith(BK2)?BK2:raw.startsWith(BK1)?BK1:"";
 if(!prefix)throw new Error("bad prefix");
 const bin=atob(raw.slice(prefix.length));
 const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
 return JSON.parse(new TextDecoder().decode(bytes));
}
